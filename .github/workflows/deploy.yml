name: Build, test and deploy

# Один workflow вместо двух независимых, как в v1 (Явно НЕ делать, п.4) —
# бэкенда больше нет, деплоить нечего кроме статики клиента.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check + тесты
        run: |
          npx tsc --noEmit
          npm test

      - name: Build
        run: npx vite build

      # Загрузка на Hostinger — до 3 попыток: SSH хостинга временами обрывает
      # подключение (сборка и тесты при этом зелёные), а однажды загрузка
      # висела полчаса — поэтому у каждой попытки предел 10 минут. Упали все
      # три — деплой красный, как раньше.
      # scp-action закреплён по коммиту, а не по тегу: тег можно перевесить,
      # а этому шагу отдаётся SSH-ключ от хостинга. Коммит — тег v0.1.7.
      - name: Deploy to Hostinger
        id: deploy1
        continue-on-error: true
        timeout-minutes: 10
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: 153.92.9.238
          port: 65002
          username: u673267555
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'dist/.'
          target: /home/u673267555/domains/slateblue-crow-206906.hostingersite.com/public_html
          strip_components: 1

      - name: Пауза перед повтором
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to Hostinger (попытка 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 10
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: 153.92.9.238
          port: 65002
          username: u673267555
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'dist/.'
          target: /home/u673267555/domains/slateblue-crow-206906.hostingersite.com/public_html
          strip_components: 1

      - name: Пауза перед последней попыткой
        if: steps.deploy2.outcome == 'failure'
        run: sleep 60

      - name: Deploy to Hostinger (попытка 3)
        if: steps.deploy2.outcome == 'failure'
        timeout-minutes: 10
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: 153.92.9.238
          port: 65002
          username: u673267555
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'dist/.'
          target: /home/u673267555/domains/slateblue-crow-206906.hostingersite.com/public_html
          strip_components: 1
